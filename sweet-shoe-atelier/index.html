<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bfeedd"><title>Sweet Shoe Atelier</title><link rel="icon" href="assets/icon_gift.webp"><link rel="stylesheet" href="style.css"><script async src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script><script defer src="js/data.js"></script><script defer src="js/merge-core.js"></script><script defer src="js/atelier-progression.js"></script><script defer src="js/studio-core.js"></script><script defer src="js/merge-orders.js"></script><script defer src="js/merge-rewards.js"></script><script defer src="js/merge-bubbles.js"></script><script defer src="js/boutique.js"></script><script defer src="js/showcase.js"></script><script defer src="js/save.js"></script><script defer src="js/fabric-regions.js"></script><script defer src="js/product-frames.js"></script><script defer src="js/shoe-renderer.js"></script><script defer src="js/item-assets.js"></script><script defer src="js/merge-screen.js"></script><script defer src="js/audio.js"></script><script defer src="js/introduction.js"></script><script defer src="js/tutorial-director.js"></script><script defer src="js/shoe2d.js"></script><script defer src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none"><defs><filter id="mint-silhouette" color-interpolation-filters="sRGB"><feFlood flood-color="#9fdcc6"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs></svg>
<div id="loading"><img src="assets/ui/logo_v4.webp" alt="Sweet Shoe Atelier"><div id="loadBar" class="load-track" role="progressbar" aria-label="Loading artwork" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loadFill"><img src="assets/shoe_flat_none.webp" alt=""></i></div><p id="loadProgress">0%</p><p id="loadText">A little magic, one stitch at a time…</p></div>
<div id="app" hidden>
<header><div class="brand"><img class="brand-mark" src="assets/icon_gift.webp" alt=""><div><h1 id="brand"></h1><p id="tagline"></p></div></div><nav id="nav" aria-label="Atelier"></nav><div class="header-right"><span id="headerEnergy" class="header-energy"></span><span class="atelier-hud"><span class="hud-pill star-pill" title="Renovation stars"><img src="assets/icon_star.webp" alt=""><b id="atelierStars">0</b></span><span class="hud-pill gem-pill" title="Gems"><img src="assets/items/ui_gem.webp" alt=""><b id="atelierGems">0</b></span><span class="hud-level" id="atelierLevel"></span></span><span class="coin-pill"><img class="ui-icon" src="assets/icon_coin.webp" alt="Coins"><b id="coins">30</b></span><button id="sound" class="icon-button" aria-label="Sound">♪</button><button id="pause" class="icon-button pause-button" aria-label="Pause"><span aria-hidden="true"></span></button></div></header>
<section id="atelierScreen" hidden aria-label="Merge Atelier"></section>
<main id="studioScreen">
<section class="customer panel" id="customer" aria-label="Customer"></section>
<section class="work-area"><div class="work-heading"><div><span class="eyebrow" id="eyebrow"></span><h2 id="workTitle"></h2></div><span class="day-badge" id="dayBadge"></span></div>
<div class="stage" id="stage"><span class="stage-label" id="stageLabel"></span><img class="spark s1" src="assets/sparkle.webp" alt=""><img class="spark s2" src="assets/sparkle.webp" alt=""><img class="spark s3" src="assets/sparkle.webp" alt=""><div class="pedestal"></div><div id="preview"></div><img class="gift open" src="assets/box_open.webp" alt=""><img class="gift closed" src="assets/box_closed.webp" alt=""><div id="combo"></div></div>
<div class="design-caption"><span id="designLabel"></span><img class="ui-icon" src="assets/icon_heart.webp" alt=""></div><div class="work-actions"><button class="secondary" id="inspire"></button><button class="primary" id="pack"></button></div><p class="stage-note" id="stageNote"></p></section>
<section class="custom panel"><div class="panel-heading"><span id="customTitle"></span><img class="ui-icon" src="assets/icon_color.webp" alt=""></div><div id="tabs" role="tablist" aria-label="Design categories"></div><div class="options-heading"><b id="partTitle"></b><span id="optionCount"></span></div><div id="options" role="tabpanel"></div><div class="sample-note" id="sampleNote"></div></section>
</main>
<footer><span id="goal"></span><span id="footerText"></span></footer>
</div><div id="modalRoot"></div><div id="tutorial" hidden></div><div id="particles" aria-hidden="true"></div><div id="toast" role="status"></div>
</body></html>
