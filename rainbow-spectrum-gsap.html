<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 彩虹光谱 - 发现你在光谱上的位置</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --warning: #f59e0b;
      --border: #2a2a3a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      height: 100vh;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 999;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-left: 15px;
    }

    /* Slides Container */
    .slides-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 60px 120px;
      opacity: 0;
      visibility: hidden;
    }

    .slide.active {
      visibility: visible;
    }

    .slide-content {
      max-width: 900px;
      width: 100%;
    }

    .slide-title {
      font-size: 56px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .slide-text {
      font-size: 22px;
      line-height: 1.8;
      color: var(--text-secondary);
      line-height: 1.9;
    }

    .slide-text strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Quote style */
    .slide-quote {
      text-align: center;
      font-size: 28px;
      line-height: 1.8;
      color: var(--text-primary);
      font-style: italic;
      max-width: 700px;
      margin: 0 auto;
    }

    .slide-quote strong {
      display: block;
      margin-top: 20px;
      font-size: 32px;
      font-style: normal;
      font-weight: 600;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 1000;
      background: rgba(26, 26, 36, 0.95);
      backdrop-filter: blur(10px);
      padding: 20px 30px;
      border-radius: 60px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .page-indicator {
      color: var(--text-secondary);
      font-size: 16px;
      min-width: 70px;
      text-align: center;
      font-weight: 500;
    }

    .page-indicator .current {
      color: var(--accent);
      font-size: 20px;
    }

    /* Animation Selector */
    .animation-selector {
      position: fixed;
      top: 100px;
      right: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }

    .anim-btn {
      background: rgba(26, 26, 36, 0.9);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    .anim-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }

    .anim-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .slide {
        padding: 100px 30px 140px;
      }

      .slide-title {
        font-size: 36px;
      }

      .slide-text {
        font-size: 18px;
      }

      .controls {
        padding: 15px 20px;
        gap: 15px;
      }

      .animation-selector {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div style="display: flex; align-items: center;">
      <span class="title">🌈 彩虹光谱</span>
      <span class="subtitle">发现你在光谱上的位置</span>
    </div>
  </div>

  <!-- Animation Selector -->
  <div class="animation-selector">
    <button class="anim-btn active" onclick="setAnimation('fade')">Fade</button>
    <button class="anim-btn" onclick="setAnimation('cinematic')">Cinematic</button>
    <button class="anim-btn" onclick="setAnimation('zoom')">Zoom</button>
    <button class="anim-btn" onclick="setAnimation('slide')">Slide</button>
    <button class="anim-btn" onclick="setAnimation('flip')">Flip</button>
    <button class="anim-btn" onclick="setAnimation('cut')">Cut</button>
  </div>

  <!-- Slides Container -->
  <div class="slides-container" id="slides-container">
    <!-- Slides will be generated by JavaScript -->
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="prevBtn" onclick="prevSlide()">← 上一页</button>
    <div class="page-indicator">
      <span class="current" id="currentPage">1</span> / <span id="totalPages">10</span>
    </div>
    <button class="btn" id="nextBtn" onclick="nextSlide()">下一页 →</button>
    <button class="btn" id="autoBtn" onclick="toggleAutoPlay()">▶ 自动播放</button>
  </div>

  <script>
    // Slides Data
    const slidesData = [
      {
        type: 'title',
        title: '你有没有想过，气质是什么？',
        text: '是你走路的方式？是你微笑的弧度？还是你眼里的光芒？<br><br>气质不是一个标签，也不是一个类型。<br>它是独特的、流动的、属于你的。<br><br>但在同志社区里，我们用一些词汇来描述相似的气质。<br>这些词汇，有历史、有故事、也有局限。'
      },
      {
        type: 'content',
        title: '1970年代，旧金山的一个夜晚',
        text: '在美国西海岸的卡斯特罗区（Castro），同志解放运动正如火如荼。<br><br>但在主流的同志审美中，"完美身材"只有一个定义：<br>瘦削、无体毛、年轻。<br><br>一群体型壮硕、体毛较多的男性聚在一起。<br>他们厌倦了被边缘化，厌倦了被告知"你们不够迷人"。'
      },
      {
        type: 'quote',
        title: '',
        text: '"我们就像熊一样，壮实、温暖、毛茸茸。"<br><br>这不是自我贬低，而是一种宣言：<br><strong>我们不需要符合主流审美。我们有自己的美。</strong>'
      },
      {
        type: 'content',
        title: '从熊到猴，从狼到鹿',
        text: '随后几十年，社区内部衍生出更多词汇，每一种都是对某种气质的描述：<br><br>• <strong>Bear 熊系</strong> - 壮硕、体毛较多、成熟稳重<br>• <strong>Otter 猴系</strong> - 精瘦、灵活、年轻活力<br>• <strong>Wolf 狼系</strong> - 成熟有型、野性魅力<br>• <strong>Deer 鹿系</strong> - 清秀纤细、文艺温柔<br><br>还有更多：Lion、Fox、Dog、Cat、Rabbit...'
      },
      {
        type: 'content',
        title: '东方语境下的"动物系"',
        text: '当这些词汇进入中国互联网环境，它们被本土化为"熊系""猴系""狼系"等"动物系"称呼。<br><br>在东方文化中，动物隐喻有特殊的含义。<br>"熊"不仅是体型描述，还带有"温暖""可靠"的情感色彩。<br><br>语言在旅行时会改变形状。<br>但核心的渴望不变：找到相似的人，建立归属感。'
      },
      {
        type: 'warning',
        title: '这些分类科学吗？',
        text: '<strong style="font-size: 28px; color: var(--warning);">不科学。</strong><br><br>这些分类只是文化现象，是对不同身体类型和气质的友好称呼。<br><br>它们不是基于：<br>✗ 心理学研究<br>✗ 生物学分析<br>✗ 基因测序<br>✗ 任何科学方法<br><br>人类是复杂的，不能被简单分类。'
      },
      {
        type: 'content',
        title: '标签的局限性',
        text: '任何标签系统都有局限。当你用"熊系""猴系"这样的词汇时，你在简化一个复杂的人：<br><br>• <strong>过度简化</strong> - 一个人可以同时具备多种类型的特征<br>• <strong>刻板印象</strong> - 标签可能强化某种刻板印象<br>• <strong>排斥性</strong> - 如果你不符合任何标签，你可能会感到被排斥<br>• <strong>流动性被忽视</strong> - 身体会改变，气质会改变'
      },
      {
        type: 'warning',
        title: '⚠️ 在使用任何标签前，请思考',
        text: '🤔 我是否认同这个标签，还是它只是外界给我的？<br><br>🤔 这个标签是帮助我找到归属，还是限制了我的可能性？<br><br>🤔 我是否在不自觉地迎合某种刻板印象？<br><br>🤔 真正的我，是否比任何标签都更丰富、更独特？'
      },
      {
        type: 'content',
        title: '流动的身份',
        text: '性别认同、身体特征、性格气质都会随时间改变。<br><br>你今天的自我认知，可能和一年后、五年后完全不同。<br><br><strong>这完全正常。</strong><br><br>身份是流动的，不是固定的。<br>拥抱变化，而不是被标签定义。<br><br>你有权利选择认同任何标签，也可以不使用任何标签。'
      },
      {
        type: 'quote',
        title: '',
        text: '"我曾经很困惑，不知道自己是什么'类型'。<br>我觉得自己不属于任何地方。"<br><br>"后来我意识到，我不需要找到一个'类型'。<br>我就是我。标签是工具，不是牢笼。"<br><br>— 一位社区成员的分享'
      },
      {
        type: 'ending',
        title: '标签是工具，不是枷锁',
        text: '最重要的是你自己的感受和认同。<br><br>你定义你自己，而不是相反。<br><br><strong style="font-size: 28px;">🌈 现在，开始自我探索</strong>'
      }
    ];

    // Variables
    let currentIndex = 0;
    let currentAnimation = 'fade';
    let isAutoPlaying = false;
    let autoPlayTimer = null;
    const container = document.getElementById('slides-container');

    // Initialize
    function init() {
      // Generate slides
      container.innerHTML = slidesData.map((slide, index) => `
        <div class="slide ${index === 0 ? 'active' : ''}" data-index="${index}">
          <div class="slide-content">
            ${slide.type === 'quote' ? 
              `<div class="slide-quote">${slide.text}</div>` :
              `${slide.title ? `<h2 class="slide-title">${slide.title}</h2>` : ''}
               <div class="slide-text">${slide.text}</div>`
            }
          </div>
        </div>
      `).join('');

      // Update page count
      document.getElementById('totalPages').textContent = slidesData.length;
      
      // Show first slide
      showSlide(0, false);
    }

    // Show slide with animation
    function showSlide(index, animate = true) {
      if (index < 0 || index >= slidesData.length) return;

      const slides = container.querySelectorAll('.slide');
      const currentSlide = slides[currentIndex];
      const nextSlide = slides[index];

      if (animate && currentSlide !== nextSlide) {
        // Hide current slide
        gsap.to(currentSlide, {
          duration: getAnimationDuration(),
          ...getAnimationOut(),
          onComplete: () => {
            currentSlide.classList.remove('active');
          }
        });

        // Show next slide
        nextSlide.classList.add('active');
        gsap.fromTo(nextSlide, 
          getAnimationIn().from,
          {
            duration: getAnimationDuration(),
            ...getAnimationIn().to,
            delay: 0.1
          }
        );
      } else if (!animate) {
        // First load, no animation
        currentSlide?.classList.remove('active');
        nextSlide.classList.add('active');
        gsap.set(nextSlide, { opacity: 1, visibility: 'visible' });
      }

      currentIndex = index;
      updateControls();
    }

    // Get animation duration
    function getAnimationDuration() {
      return currentAnimation === 'cut' ? 0.1 : 0.8;
    }

    // Get animation OUT config
    function getAnimationOut() {
      switch (currentAnimation) {
        case 'fade':
          return { opacity: 0, ease: 'power2.in' };
        case 'cinematic':
          return { scale: 1.15, opacity: 0, filter: 'blur(10px)', ease: 'power2.in' };
        case 'zoom':
          return { scale: 0.3, opacity: 0, ease: 'power2.in' };
        case 'slide':
          return { x: -window.innerWidth, opacity: 0, ease: 'power3.in' };
        case 'flip':
          return { rotationY: -90, opacity: 0, ease: 'power2.in' };
        case 'cut':
          return { opacity: 0, duration: 0.05 };
        default:
          return { opacity: 0 };
      }
    }

    // Get animation IN config
    function getAnimationIn() {
      switch (currentAnimation) {
        case 'fade':
          return {
            from: { opacity: 0 },
            to: { opacity: 1, ease: 'power2.out' }
          };
        case 'cinematic':
          return {
            from: { scale: 0.85, opacity: 0, filter: 'blur(10px)' },
            to: { scale: 1, opacity: 1, filter: 'blur(0px)', ease: 'power2.out' }
          };
        case 'zoom':
          return {
            from: { scale: 1.8, opacity: 0 },
            to: { scale: 1, opacity: 1, ease: 'power2.out' }
          };
        case 'slide':
          return {
            from: { x: window.innerWidth, opacity: 0 },
            to: { x: 0, opacity: 1, ease: 'power3.out' }
          };
        case 'flip':
          return {
            from: { rotationY: 90, opacity: 0 },
            to: { rotationY: 0, opacity: 1, ease: 'power2.out' }
          };
        case 'cut':
          return {
            from: { opacity: 0 },
            to: { opacity: 1, duration: 0.05 }
          };
        default:
          return {
            from: { opacity: 0 },
            to: { opacity: 1 }
          };
      }
    }

    // Navigation
    function nextSlide() {
      if (currentIndex < slidesData.length - 1) {
        showSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        showSlide(currentIndex - 1);
      }
    }

    // Set animation type
    function setAnimation(type) {
      currentAnimation = type;
      
      // Update UI
      document.querySelectorAll('.anim-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    // Auto play
    function toggleAutoPlay() {
      isAutoPlaying = !isAutoPlaying;
      const btn = document.getElementById('autoBtn');
      
      if (isAutoPlaying) {
        btn.textContent = '⏸ 暂停';
        autoPlayTimer = setInterval(() => {
          if (currentIndex < slidesData.length - 1) {
            nextSlide();
          } else {
            toggleAutoPlay();
          }
        }, 5000);
      } else {
        btn.textContent = '▶ 自动播放';
        clearInterval(autoPlayTimer);
      }
    }

    // Update controls
    function updateControls() {
      document.getElementById('currentPage').textContent = currentIndex + 1;
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === slidesData.length - 1;
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevSlide();
      }
    });

    // Initialize on load
    init();
  </script>
</body>
</html>
