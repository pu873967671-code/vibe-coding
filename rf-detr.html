<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 武器检测 | GP's Vibe Coding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #222230;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2a3a;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    main {
      padding: 60px 0;
    }

    .tool-header {
      text-align: center;
      margin-bottom: 48px;
    }

    .tool-header h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f0f0f5, #a5a5c0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tool-header p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    .api-config {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .api-config label {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .api-config input {
      flex: 1;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 14px;
    }

    .upload-area {
      background: var(--bg-card);
      border: 2px dashed var(--border);
      border-radius: 16px;
      padding: 60px 40px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 32px;
    }

    .upload-area:hover {
      border-color: var(--accent);
      background: var(--bg-card-hover);
    }

    .upload-area.dragging {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.1);
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .upload-text {
      font-size: 18px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .upload-hint {
      font-size: 14px;
      color: var(--text-secondary);
      opacity: 0.7;
    }

    #fileInput {
      display: none;
    }

    .preview-section {
      display: none;
      margin-bottom: 32px;
    }

    .preview-section.show {
      display: block;
    }

    .preview-container {
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      overflow: hidden;
    }

    #previewImage {
      width: 100%;
      max-height: 500px;
      object-fit: contain;
      display: block;
    }

    #canvasOverlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 10, 15, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .loading-overlay.hidden {
      display: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .results-section {
      display: none;
    }

    .results-section.show {
      displa   }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .results-grid {
        grid-template-columns: 1fr;
      }
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .result-card h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--accent);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag.weapon {
      border-color: var(--error);
      background: rgba(239, 68, 68, 0.1);
    }

    .tag-confidence {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .json-output {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      color: var(--text-secondary);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      borde var(--border);
    }

    .btn-secondary:hover {
      background: var(--bg-card-hover);
    }

    .status-bar {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
    }

    .status-dot.ready {
      background: var(--success);
    }

    .status-dot.error {
      background: var(--error);
    }

    .status-text {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .stats-row {
      display: flex;
      gap: 24px;
      margin-top: 16px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-value.danger {
      color: var(--error);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div class="header-content">
        <a href="./" class="logo">
          <div class="logo-icon">🔫</div>
          <span class="logo-text">AI 武器检测</span>
        </a>
        <a href="./" class="back-link">← 返回首页</a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="tool-header">
        <h1>AI 武器检测系统</h1>
        <p>上传图片，自动识别武器 | 基于 RF-DETR 武器检测模型</p>
      </div>

      <div class="api-config">
        <label>API 地址:</label>
        <input type="text" id="apiUrl" value="http://localhost:5000" placeholder="http://localhost:5000">
      </div>

      <div class="status-bar">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">正在连接后端 API...</span>
      </div>

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📷</div>
        <div class="upload-text">点击或拖拽上传图片</div>
        <div class="upload-hint">支持 JPG、PNG、WebP 格式</div>
        <input type="file" id="fileInput" accept="image/*">
      </div>

      <div class="preview-section" id="previewSection">
        <div class="preview-container">
          <img id="previewImage" alt="预览">
          <canvas id="canvasOverlay"></canvas>
          <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text">正在分析图片...</div>
          </div>
        </div>
      </div>

      <div class="results-section" id="resultsSection">
        <div class="results-grid">
          <div class="result-card">
            <h3>🔫 检测结果</h3>
            <div class="tag-list" id="tagList"></div>
            <div class="stats-row">
              <div class="stat-item">
                <div class="stat-value danger" id="weaponCount">0</div>
                <div class="stat-label">检测到武器</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" id="classCount">0</div>
                <div class="stat-label">类别数</div>
              </div>
            </div>
          </div>

          <div class="result-card">
            <h3>📋 JSON 输出</h3>
            <div class="json-output" id="jsonOutput"></div>
            <div class="actions">
              <button class="btn btn-primary" id="copyBtn">复制 JSON</button>
              <button class="btn btn-secondary" id="downloadBtn">下载 JSON</button>
              <button class="btn btn-secondary" id="resetBtn">重新上传</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2026 GP's Vibe Coding | 基于 RF-DETR 武器检测模型</p>
    </div>
  </footer>

  <script>
    // DOM 元素
    const apiUrlInput = document.getElementById('apiUrl');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewSection = document.getElementById('previewSection');
    const previewImage = document.getElementById('previewImage');
    const canvasOverlay = document.getElementById('canvasOverlay');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const resultsSection = document.getElementById('resultsSection');
    const tagList = document.getElementById('tagList');
    const jsonOutput = document.getElementById('jsonOutput');
    const weaponCount = document.getElementById('weaponCount');
    const classCount = document.getElementById('classCount');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let currentResults = null;

    // 检查 API 健康状态
    async function checkAPIHealth() {
      try {
        const response = await fetch(`${apiUrlInput.value}/health`);
        if (response.ok) {
          const data = await response.json();
          statusDot.classList.add('ready');
          statusText.textContent = `后端已就绪 (${data.model})`;
          return true;
        }
      } catch (error) {
        statusDot.classList.add('error');
        statusText.textContent = '无法连接到后端 API，请确保服务已启动';
        console.error('API health check failed:', error);
      }
      return false;
    }

    // 处理文件上传
    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('请上传图片文件');
        return;
      }

      const reader = new FileReader();
      reader.onload = async (e) => {
        previewImage.src = e.target.result;
        previewSection.classList.add('show');
        resultsSection.classList.remove('show');
        loadingOverlay.classList.remove('hidden');
        
        await detectWeapons(e.target.result);
      };
      reader.readAsDataURL(file);
    }

    // 检测武器
    async function detectWeapons(imageSrc) {
      try {
        const response = await fetch(`${apiUrlInput.value}/detect`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            image_base64: imageSrc
          })
        });

        if (!response.ok) {
          throw new Error(`API 返回错误: ${response.status}`);
        }

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }

        currentResults = data.detections;
        
        // 绘制检测框
        drawBoundingBoxes(data.detections);
        
        // 显示结果
        displayResults(data.detections);
        
      } catch (error) {
        console.error('Detection error:', error);
        alert('检测失败: ' + error.message);
      } finally {
        loadingOverlay.classList.add('hidden');
      }
    }

    // 绘制边界框
    function drawBoundingBoxes(results) {
      const img = previewImage;
      canvasOverlay.width = img.clientWidth;
      canvasOverlay.height = img.clientHeight;
      
      const ctx = canvasOverlay.getContext('2d');
      ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
      
      const scaleX = img.clientWidth / img.naturalWidth;
      const scaleY = img.clientHeight / img.naturalHeight;
      
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4'];
      
      results.forEach((result, index) => {
        const { xmin, ymin, xmax, ymax } = result.box;
        
        const x = xmin * scaleX;
        const y = ymin * scaleY;
        const width = (xmax - xmin) * scaleX;
        const height = (ymax - ymin) * scaleY;
        
        const color = colors[index % colors.length];
        
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, width, height);
        
        // 标签背景
        const label = `${result.label} ${(result.score * 100).toFixed(0)}%`;
        ctx.font = 'bold 14px Inter, sans-serif';
        const textWidth = ctx.measureText(label).width;
        ctx.fillStyle = color;
        ctx.fillRect(x, y - 24, textWidth + 12, 24);
        
        // 标签文字
        ctx.fillStyle = 'white';
        ctx.fillText(label, x + 6, y - 6);
      });
    }

    // 显示结果
    function displayResults(results) {
      // 统计
      const classes = new Set(results.map(r => r.label));
      weaponCount.textContent = results.length;
      classCount.textContent = classes.size;
      
      // 标签列表
      tagList.innerHTML = results.length > 0 
        ? results.map(result => `
            <div class="tag weapon">
              ${result.label}
              <span class="tag-confidence">${(result.score * 100).toFixed(0)}%</span>
            </div>
          `).join('')
        : '<div class="tag">未检测到武器</div>';
      
      // JSON 输出
      const jsonOutputData = {
        timestamp: new Date().toISOString(),
        totalWeapons: results.length,
        uniqueClasses: classes.size,
        detections: results
      };
      
      jsonOutput.textContent = JSON.stringify(jsonOutputData, null, 2);
      resultsSection.classList.add('show');
    }

    // 事件监听
    uploadArea.addEventListener('click', () => fileInput.click());
    
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragging');
    });
    
    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragging');
    });
    
    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragging');
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
    
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) {
        handleFile(e.target.files[0]);
      }
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(jsonOutput.textContent);
      copyBtn.textContent = '已复制!';
      setTimeout(() => copyBtn.textContent = '复制 JSON', 2000);
    });

    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([jsonOutput.textContent], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `weapon-detection-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener('click', () => {
      previewSection.classList.remove('show');
      resultsSection.classList.remove('show');
      fileInput.value = '';
      currentResults = null;
    });

    // 初始化
    checkAPIHealth();
  </script>
</body>
</html>
