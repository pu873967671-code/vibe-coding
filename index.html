<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #222230;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2a3a;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ✨ 粒子背景 Canvas */
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Header + 滚动效果 */
    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      transition: box-shadow 0.3s ease;
    }

    header.scrolled {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
    }

    .lang-switch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .lang-switch:hover {
      background: var(--bg-card-hover);
    }

    /* Hero */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    /* 💫 头像呼吸动画 */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 24px;
      overflow: hidden;
      animation: avatarGlow 3s ease-in-out infinite;
      background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #ec4899 100%);
      padding: 3px;
      box-sizing: border-box;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid var(--bg-primary);
    }

    @keyframes avatarGlow {
      0%, 100% {
        box-shadow: 0 0 30px rgba(0, 212, 255, 0.6), 0 0 60px rgba(236, 72, 153, 0.4);
      }
      50% {
        box-shadow: 0 0 50px rgba(0, 212, 255, 0.8), 0 0 100px rgba(236, 72, 153, 0.6);
      }
    }

    /* ⌨️ 打字机标题 */
    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f0f0f5, #a5a5c0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .hero h1 .cursor {
      display: inline-block;
      width: 3px;
      height: 1em;
      background: var(--accent);
      margin-left: 4px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    .tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .tag::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);
      transition: left 0.4s ease;
    }

    .tag:hover::before {
      left: 100%;
    }

    .tag:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
    }

    /* Search */
    .search-section {
      padding: 0 0 40px;
    }

    .search-box {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .search-shortcut {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      pointer-events: none;
      opacity: 0.7;
    }

    .search-input:focus ~ .search-shortcut {
      opacity: 0;
    }

    /* 🔮 搜索框聚焦光晕 */
    .search-input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 16px 24px 16px 52px;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      animation: searchGlow 2s ease-in-out infinite;
    }

    @keyframes searchGlow {
      0%, 100% {
        box-shadow: 0 0 5px rgba(99, 102, 241, 0.3), 0 0 10px rgba(99, 102, 241, 0.1);
      }
      50% {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.5), 0 0 30px rgba(99, 102, 241, 0.2);
      }
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .filter-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }

    .filter-btn:hover::before {
      width: 200%;
      height: 200%;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .filter-btn.active::before {
      display: none;
    }

    /* Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    /* 📦 卡片入场动画 + 🌟 悬停发光 + 💫 点击 Ripple */
    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
      animation: cardFadeIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      position: relative;
      overflow: hidden;
    }

    .tool-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.15), transparent);
      transition: left 0.6s ease;
    }

    .tool-card:hover::before {
      left: 100%;
    }

    /* 点击 Ripple 效果 */
    .tool-card .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      animation: rippleExpand 0.6s ease-out forwards;
    }

    @keyframes rippleExpand {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
      }
      100% {
        width: 400px;
        height: 400px;
        opacity: 0;
      }
    }

    /* 卡片入场延迟 */
    .tool-card:nth-child(1) { animation-delay: 0.05s; }
    .tool-card:nth-child(2) { animation-delay: 0.1s; }
    .tool-card:nth-child(3) { animation-delay: 0.15s; }
    .tool-card:nth-child(4) { animation-delay: 0.2s; }
    .tool-card:nth-child(5) { animation-delay: 0.25s; }
    .tool-card:nth-child(6) { animation-delay: 0.3s; }
    .tool-card:nth-child(7) { animation-delay: 0.35s; }
    .tool-card:nth-child(8) { animation-delay: 0.4s; }
    .tool-card:nth-child(9) { animation-delay: 0.45s; }
    .tool-card:nth-child(10) { animation-delay: 0.5s; }
    .tool-card:nth-child(n+11) { animation-delay: 0.55s; }

    @keyframes cardFadeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.3),
        0 0 30px rgba(99, 102, 241, 0.3),
        0 0 60px rgba(139, 92, 246, 0.2);
    }

    .tool-card.hidden {
      display: none;
    }

    .tool-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .tool-info h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tool-info .category {
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tool-desc {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .tool-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tool-price {
      font-size: 14px;
      font-weight: 600;
    }

    .tool-price.free {
      color: var(--success);
    }

    .tool-price.paid {
      color: var(--warning);
    }

    .tool-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .tool-link:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* No results */
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
      display: none;
    }

    .no-results.show {
      display: block;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 24px 0;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      transition: transform 0.3s ease;
      animation: countUp 0.5s ease forwards;
    }

    .stat:hover .stat-value {
      transform: scale(1.1);
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);
    }
  </style>
</head>

    let currentLang = 'zh';
    let currentFilter = 'all';

    function renderTools() {
      const grid = document.getElementById('toolsGrid');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();
      let filtered = tools;

      // Filter by category
      if (currentFilter !== 'all') {
        filtered = filtered.filter(t => t.category === currentFilter);
      }

      // Filter by search
      if (searchTerm) {
        filtered = filtered.filter(t => {
          const name = currentLang === 'zh' ? t.nameZh : t.name;
          const desc = currentLang === 'zh' ? t.descZh : t.descEn;
          return name.toLowerCase().includes(searchTerm) || desc.toLowerCase().includes(searchTerm);
        });
      }

      // Update counts
      document.getElementById('totalCount').textContent = tools.length;
      document.getElementById('freeCount').textContent = tools.filter(t => t.price === 'free').length;

      // Show/hide no results
      const noResults = document.getElementById('noResults');
      if (filtered.length === 0) {
        noResults.classList.add('show');
        grid.innerHTML = '';
        return;
      }
      noResults.classList.remove('show');

      // Render cards
      grid.innerHTML = filtered.map(tool => {
        const name = currentLang === 'zh' ? tool.nameZh : tool.name;
        const desc = currentLang === 'zh' ? tool.descZh : tool.descEn;
        const category = currentLang === 'zh' ? tool.categoryZh : tool.categoryEn;
        const priceText = currentLang === 'zh' ? tool.priceZh : tool.priceEn;
        
        return `
          <div class="tool-card" data-link="${tool.link}">
            <div class="tool-header">
              <div class="tool-icon" style="background: ${tool.iconBg}">${tool.icon}</div>
              <div class="tool-info">
                <h3>${name}</h3>
                <span class="category">${category}</span>
              </div>
            </div>
            <p class="tool-desc">${desc}</p>
            <div class="tool-footer">
              <span class="tool-price ${tool.price === 'free' ? 'free' : tool.price === 'paid' ? 'paid' : ''}">${priceText}</span>
              <a href="${tool.link}" target="_blank" class="tool-link" onclick="event.stopPropagation()">${currentLang === 'zh' ? '访问' : 'Visit'} →</a>
            </div>
          </div>
        `;
      }).join('');
      
      // 添加卡片点击事件（含 ripple 效果）
      document.querySelectorAll('.tool-card').forEach(card => {
        card.addEventListener('click', function(e) {
          // 创建 ripple 元素
          const ripple = document.createElement('div');
          ripple.className = 'ripple-effect';
          ripple.style.left = e.offsetX + 'px';
          ripple.style.top = e.offsetY + 'px';
          this.appendChild(ripple);
          
          // 动画结束后移除
          ripple.addEventListener('animationend', () => ripple.remove());
          
          // 延迟打开链接
          const link = this.dataset.link;
          setTimeout(() => {
            window.open(link, '_blank');
          }, 200);
        });
      });
    }

    function toggleLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      
      // Update placeholders
      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = searchInput.dataset[currentLang === 'zh' ? 'zh-placeholder' : 'en-placeholder'];
      
      // Update filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.textContent = btn.dataset[currentLang === 'zh' ? 'zh' : 'en'];
      });
      
      // Update stats labels
      document.querySelectorAll('.stat-label').forEach(label => {
        label.textContent = label.dataset[currentLang === 'zh' ? 'zh' : 'en'];
      });
      
      // Update hero text
      document.querySelectorAll('[data-zh][data-en]').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });
      
      // Update footer
      document.querySelectorAll('footer p').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });
      
      renderTools();
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTools();
      });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', renderTools);

    // Keyboard shortcut: Ctrl+K or / to focus search
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement.tagName !== 'INPUT')) {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      // ESC to clear search
      if (e.key === 'Escape') {
        document.getElementById('searchInput').value = '';
        document.getElementById('searchInput').blur();
        renderTools();
      }
    });

    // Initial render
    renderTools();
    
    // ============ ✨ 粒子背景系统 ============
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouseX = 0;
    let mouseY = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * 0.4 - 0.2;
        this.opacity = Math.random() * 0.5 + 0.2;
        this.hue = Math.random() > 0.5 ? 239 : 263;
        this.pulseSpeed = Math.random() * 0.02 + 0.01;
        this.pulsePhase = Math.random() * Math.PI * 2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.pulsePhase += this.pulseSpeed;
        this.currentOpacity = this.opacity * (0.7 + 0.3 * Math.sin(this.pulsePhase));

        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 120) {
          const force = (120 - dist) / 120;
          this.x -= dx * force * 0.015;
          this.y -= dy * force * 0.015;
        }

        if (this.x < 0) this.x = canvas.width;
        if (this.x > canvas.width) this.x = 0;
        if (this.y < 0) this.y = canvas.height;
        if (this.y > canvas.height) this.y = 0;
      }

      draw() {
        ctx.fillStyle = `hsla(${this.hue}, 70%, 65%, ${this.currentOpacity || this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const particleCount = Math.min(80, Math.floor((canvas.width * canvas.height) / 15000));
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function drawConnections() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 120) {
            ctx.strokeStyle = `rgba(99, 102, 241, ${0.15 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      drawConnections();
      requestAnimationFrame(animateParticles);
    }

    resizeCanvas();
    initParticles();
    animateParticles();

    window.addEventListener('resize', () => {
      resizeCanvas();
      initParticles();
    });

    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    // ============ ⌨️ 打字机标题效果 ============
    function typeWriter(element, text, speed = 100) {
      let i = 0;
      element.innerHTML = '';
      
      function type() {
        if (i < text.length) {
          element.innerHTML = text.substring(0, i + 1) + '<span class="cursor"></span>';
          i++;
          setTimeout(type, speed);
        }
      }
      
      type();
    }

    window.addEventListener('load', () => {
      const titleEl = document.getElementById('hero-title');
      const titleText = "GP's Vibe Coding";
      setTimeout(() => typeWriter(titleEl, titleText, 120), 500);
    });

    // ============ 滚动效果 ============
    const header = document.querySelector('header');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 50) {
        header.classList.add('scrolled');
      } else {
        header.classList.remove('scrolled');
      }
    });
  </script>
</body>
</html>
