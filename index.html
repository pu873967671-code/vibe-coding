    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-card-hover: #222230;
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --border: #2a2a3a;
      --success: #22c55e;
      --warning: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Background pattern */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
    }

    .lang-switch {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }

    .lang-switch:hover {
      background: var(--bg-card-hover);
    }

    /* Hero */
    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 24px;
      box-shadow: 0 0 60px rgba(99, 102, 241, 0.3);
      overflow: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero h1 {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f0f0f5, #a5a5c0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto 32px;
    }

    .tags {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tag {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all 0.2s;
    }

    .tag:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Search */
    .search-section {
      padding: 0 0 40px;
    }

    .search-box {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 16px 24px 16px 52px;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding-bottom: 40px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* Grid */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding-bottom: 80px;
    }

    .tool-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .tool-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .tool-card.hidden {
      display: none;
    }

    .tool-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 12px;
    }

    .tool-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .tool-info h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tool-info .category {
      font-size: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tool-desc {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .tool-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tool-price {
      font-size: 14px;
      font-weight: 600;
    }

    .tool-price.free {

    }

    .tool-price.paid {
      color: var(--warning);
    }

    .tool-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .tool-link:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;

      color: var(--text-secondary);
      display: none;
    }

      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 24px 0;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-secondary);

        });
      }

      // Update counts
      document.getElementById('totalCount').textContent = tools.length;
      document.getElementById('freeCount').textContent = tools.filter(t => t.price === 'free').length;

      // Show/hide no results
      const noResults = document.getElementById('noResults');
      if (filtered.length === 0) {
        noResults.classList.add('show');
        grid.innerHTML = '';
        return;
      }
      noResults.classList.remove('show');

      // Render cards
      grid.innerHTML = filtered.map(tool => {
        const name = currentLang === 'zh' ? tool.nameZh : tool.name;
        const desc = currentLang === 'zh' ? tool.descZh : tool.descEn;
        const category = currentLang === 'zh' ? tool.categoryZh : tool.categoryEn;
        const priceText = currentLang === 'zh' ? tool.priceZh : tool.priceEn;
        
        return `
          <div class="tool-card" onclick="window.open('${tool.link}', '_blank')">
            <div class="tool-header">
              <div class="tool-icon" style="background: ${tool.iconBg}">${tool.icon}</div>
              <div class="tool-info">
                <h3>${name}</h3>
                <span class="category">${category}</span>
              </div>
            </div>
            <p class="tool-desc">${desc}</p>
            <div class="tool-footer">
              <span class="tool-price ${tool.price === 'free' ? 'free' : tool.price === 'paid' ? 'paid' : ''}">${priceText}</span>
              <a href="${tool.link}" target="_blank" class="tool-link" onclick="event.stopPropagation()">${currentLang === 'zh' ? '访问' : 'Visit'} →</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      
      // Update placeholders
      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = searchInput.dataset[currentLang === 'zh' ? 'zh-placeholder' : 'en-placeholder'];
      
      // Update filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.textContent = btn.dataset[currentLang === 'zh' ? 'zh' : 'en'];
      });
      
      // Update stats labels
      document.querySelectorAll('.stat-label').forEach(label => {
        label.textContent = label.dataset[currentLang === 'zh' ? 'zh' : 'en'];
      });
      
      // Update hero text
      document.querySelectorAll('[data-zh][data-en]').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });
      
      // Update footer
      document.querySelectorAll('footer p').forEach(el => {
        el.textContent = el.dataset[currentLang];
      });
      
      renderTools();
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderTools();
      });
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', renderTools);

    // Initial render
    renderTools();
  </script>
</body>
</html>
